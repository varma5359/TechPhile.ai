{% if messages %}
    {% for message in messages %}
        <div class="tp-alert tp-alert-{{ message.tags|default:'info' }} mb-4">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<style>
    /* Career specific overrides that rely on the design system */
    .cp-page { width: 100%; max-width: 1140px; margin: 0 auto; padding-bottom: var(--tp-space-8); }
    .cp-breadcrumb { font-size: var(--tp-text-sm); margin-bottom: var(--tp-space-4); color: var(--tp-text-muted); }
    .cp-breadcrumb a { color: var(--tp-primary); text-decoration: none; font-weight: 500; }
    .cp-breadcrumb a:hover { text-decoration: underline; }
    
    .cp-panel { background: var(--tp-surface); border: 1px solid var(--tp-border); border-radius: var(--tp-radius-lg); padding: var(--tp-space-6); margin-bottom: var(--tp-space-6); box-shadow: var(--tp-shadow-sm); }
    .cp-panel h2 { font-size: var(--tp-text-xl); margin-bottom: var(--tp-space-4); }
    
    .cp-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--tp-space-4); margin-bottom: var(--tp-space-6); }
    @media(min-width: 768px) { .cp-stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .cp-stat { background: var(--tp-surface); border: 1px solid var(--tp-border); border-radius: var(--tp-radius-md); padding: var(--tp-space-4); box-shadow: var(--tp-shadow-sm); }
    .cp-stat span { display: block; font-size: var(--tp-text-xs); color: var(--tp-text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--tp-space-1); }
    .cp-stat strong { font-size: var(--tp-text-lg); color: var(--tp-text-main); }
    
    .cp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem 1rem; font-size: var(--tp-text-sm); font-weight: 500; border-radius: var(--tp-radius-md); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; text-decoration: none; background: var(--tp-primary); color: white; }
    .cp-btn:hover { background: var(--tp-primary-hover); color: white; }
    .cp-btn.outline { background: transparent; color: var(--tp-primary); border-color: var(--tp-border-strong); }
    .cp-btn.outline:hover { background: var(--tp-primary-soft); border-color: var(--tp-primary); }
    
    .cp-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.6rem; font-size: var(--tp-text-xs); font-weight: 600; border-radius: 999px; background: var(--tp-surface-muted); color: var(--tp-text-muted); }
    .cp-badge.completed { background: var(--tp-success-bg); color: #065F46; }
    .cp-badge.in_progress { background: var(--tp-primary-soft); color: var(--tp-primary); }
    .cp-badge.locked { background: #F1F5F9; color: #94A3B8; }
    
    .cp-bar { height: 8px; background: var(--tp-surface-muted); border-radius: 999px; overflow: hidden; margin-bottom: var(--tp-space-2); }
    .cp-bar span { display: block; height: 100%; background: var(--tp-primary); border-radius: inherit; }
</style>
