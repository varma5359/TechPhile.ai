<nav class="lx-nav" aria-label="Day navigation">
    {% if previous_day %}
        <a class="cp-btn outline" href="{% url 'careers:level_day_detail' role.slug level previous_day.day_number %}">&larr; Day {{ previous_day.day_number }}</a>
    {% else %}
        <span></span>
    {% endif %}
    <a class="cp-btn outline" href="{% url 'careers:level_role_detail' role.slug level %}">Back to {{ role.title }} plan</a>
    {% if next_day %}
        {% if next_unlocked %}
            <a class="cp-btn" href="{% url 'careers:level_day_detail' role.slug level next_day.day_number %}">Day {{ next_day.day_number }} &rarr;</a>
        {% else %}
            <span class="cp-badge locked" title="Submit this day to unlock the next one"><i class="fas fa-lock"></i> Day {{ next_day.day_number }} locked</span>
        {% endif %}
    {% else %}
        <span></span>
    {% endif %}
</nav>
