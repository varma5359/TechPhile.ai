{% extends 'base.html' %}
{% load static %}
{% block title %}Message Sent | TechPhile.ai{% endblock %}
{% block contents %}
<div class="tp-container py-5 d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="tp-card p-5 text-center shadow-sm border-0" style="max-width: 500px;">
        <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 64px; height: 64px;">
            <i class="fas fa-check fs-2"></i>
        </div>
        <h1 class="h3 fw-bold mb-2">Message received</h1>
        <p class="text-muted mb-4">Thank you for reaching out. Your message has been sent to the TechPhile.ai team.</p>
        <a href="{% url 'home' %}" class="tp-btn tp-btn-primary">Return home</a>
    </div>
</div>
<script>
    setTimeout(function(){ window.location.href="{% url 'contact' %}"; }, 5000);
</script>
{% endblock %}
