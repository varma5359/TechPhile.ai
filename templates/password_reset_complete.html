{% extends 'registration/registration_base.html' %}

{% block title %}Password updated | TechPhile.ai{% endblock %}

{% block contents %}
<main class="container auth-page">
    <section class="auth-panel auth-status-panel" aria-labelledby="password-reset-complete-title">
        <span class="auth-status-icon success" aria-hidden="true"><i class="fas fa-check"></i></span>
        <span class="auth-eyebrow">Password reset</span>
        <h1 id="password-reset-complete-title">Your password is updated</h1>
        <p class="auth-intro">You can now sign in with your new password.</p>
        <a class="btn btn-primary" href="{% url 'login' %}">Sign in</a>
    </section>
</main>
{% endblock %}
