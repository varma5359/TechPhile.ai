{% extends 'registration/registration_base.html' %}

{% block title %}Password updated | TechPhile.ai{% endblock %}

{% block content %}
    <section class="auth-status-panel" aria-labelledby="password-reset-complete-title">
        <span class="auth-status-icon success" aria-hidden="true"><i class="fas fa-check"></i></span>
        <p class="auth-eyebrow">PASSWORD RESET</p>
        <h2 class="auth-title" id="password-reset-complete-title">Your password has been updated</h2>
        <p class="auth-intro">Your account is ready. Sign in with your new password to continue learning.</p>
        <a class="auth-submit auth-submit-link" href="{% url 'login' %}">Sign in <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </section>
{% endblock %}
