{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Continue to TechPhile.ai{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{% static 'css/design-system.css' %}" rel="stylesheet">
    <link href="{% static 'css/app-redesign.css' %}" rel="stylesheet">
    <link href="{% static 'css/modern-ui.css' %}" rel="stylesheet">
</head>
<body class="auth-shell auth-google-only">
    <a class="skip-link" href="#auth-main">Skip to sign in</a>
    <main class="auth-google-page" id="auth-main">
        <a class="auth-google-brand" href="{% url 'home' %}" aria-label="TechPhile.ai home">
            <span class="auth-brand-mark" aria-hidden="true"><i class="fas fa-layer-group"></i></span>
            <span>TechPhile<span>.ai</span></span>
        </a>
        <section class="auth-google-card" aria-labelledby="auth-page-title">
            {% block content %}{% endblock %}
        </section>
        <p class="auth-google-back"><a href="{% url 'home' %}">Return to TechPhile.ai</a></p>
    </main>
</body>
</html>
