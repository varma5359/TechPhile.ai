{% extends "exams/exam_base.html" %}

{% block content %}
<div class="container my-5">
    <div class="card shadow-lg">
        <div class="card-header bg-info text-white">
            <h3 class="mb-0">
                <i class="fas fa-calendar-alt me-2"></i>
                Reschedule Interview
            </h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="{{ form.interview_date.id_for_label }}">New Date</label>
                            {{ form.interview_date }}
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="{{ form.interview_time.id_for_label }}">New Time Slot</label>
                            {{ form.interview_time }}
                        </div>
                    </div>
                </div>

                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Please note that interviews must be rescheduled at least 24 hours in advance.
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'exams:view_interview' interview.pk %}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-calendar-check me-2"></i> Confirm Reschedule
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
